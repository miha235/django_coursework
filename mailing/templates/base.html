<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Сервис рассылок{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="{% url 'client_list' %}">Сервис рассылок</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'client_list' %}">Клиенты</a>
                <a class="nav-link" href="{% url 'message_list' %}">Сообщения</a>
                <a class="nav-link" href="{% url 'mailing_list' %}">Рассылки</a>
                <a class="nav-link" href="{% url 'mailing_statistics' %}">Статистика</a>
                <a class="nav-link" href="{% url 'mailing_logs' %}">Логи</a>
                {% if user.is_authenticated %}
                <a> {{ user }} </a>
                {% endif %}
            </div>

            <!-- Кнопки регистрации и входа -->
            <div class="ms-3">
                {% if user.is_authenticated %}
                    <div>
                        <form id="logout-form" action="{% url 'logout' %}" method="POST">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-primary me-2">Выйти</button>
                        </form>
                    </div>
                {% else %}
                    <a class="btn btn-secondary" href="{% url 'signup' %}">Регистрация</a>
                    <a class="btn btn-primary me-2" href="{% url 'login' %}">Вход</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
