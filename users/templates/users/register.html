{% extends 'mailing/templates/base.html' %}


{% block content %}

  <div class="container">
    <h2>Регистрация нового пользователя</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}  <!-- Это отобразит форму в виде абзацев, каждый с полем и меткой -->
      <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
    </form>
  </div>
{% endblock %}
